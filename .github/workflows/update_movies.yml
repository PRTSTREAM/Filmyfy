Name: Update FilmyFly 1080p Playlist

on:
  schedule:
    - cron: '0 */12 * * *' # हर 12 घंटे में ऑटोमैटिक रन होगा
  workflow_dispatch: # मैन्युअली भी रन करने का बटन मिलेगा

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.code"
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 1080p movie playlist [skip ci]" && git push)
