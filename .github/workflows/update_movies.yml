
name: Update Movies Playlist Every 2 Hours

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-movies-playlist
  cancel-in-progress: false

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scraper.py

      - name: Validate Playlist
        run: |
          if [ ! -f playlist.m3u ]; then
            echo "ERROR: playlist.m3u file not found!"
            exit 1
          fi

          if ! grep -q '^#EXTM3U' playlist.m3u; then
            echo "ERROR: Invalid M3U playlist!"
            exit 1
          fi

          if ! grep -q '^#EXTINF:' playlist.m3u; then
            echo "ERROR: No movie entries found. Keeping repository unchanged."
            exit 1
          fi

          echo "Playlist validation successful."
          echo "Playlist entries: $(grep -c '^#EXTINF:' playlist.m3u)"

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "Playlist is unchanged. No commit required."
          else
            git commit -m "Auto-update movies playlist"
            git push
          fi
          
